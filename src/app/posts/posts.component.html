<header class="page-header">
  <h1>Community Feed</h1>
</header>

<main>
  <section class="posts-list">
    <article class="post-card" *ngFor="let post of posts; let i = index">
      <h2>{{ post.title }}</h2>
      <p>{{ post.description }}</p>

      <button class="delete-btn" (click)="deletePost(i)">
        Delete
      </button>
    </article>
  </section>
</main>
